<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts: Preconnect and load 'Shadows Into Light Two' for the handwritten aesthetic -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shadows+Into+Light+Two&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Main Application Container -->
    <div class="container">
        <h1>My To-Do List</h1>

        <!-- Input Section: Text field and 'Add' button -->
        <div class="input-group">

             <input type="text" id="task-input">
             <button id="add-btn">Add</button>
            
        </div>

        <div class="filters">
            <button id="filter-all">
                All
            </button>
            <button id="filter-active">
                Active
            </button>
            <button id="filter-completed">
                Completed
            </button>
        </div>


        <!-- Task List: Dynamic list of items -->
        <ul id="task-list">

        </ul>

        <div>
            <button id="clear-completed">Clear Completed</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
